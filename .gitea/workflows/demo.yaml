name: Gitea Actions Demo
run-name: ${{ gitea.actor }} is testing out Gitea Actions 🚀
on: [push]

jobs:
  Explore-Gitea-Actions:
    runs-on: windows
    steps:
      - name: Deploy via SSH
      - run: echo "[Info] Conectando ao ssh..."
      - shell: powershell
      - run: ssh deploy@SEU_IP "cd /home/deploy/repositorio && git pull origin main && docker compose down && docker compose up -d --build"
      - run: echo "[Info] Pull request enviado para o servidor de desenvolvimento."
      - run: echo "[Info] Repositório ${{ gitea.repository }} online para desenvolvimento."
      - run: echo "🍏 This job's status is ${{ job.status }}."